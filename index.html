<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Actividades - Edificio La Rotonda - Accenture - Amb La Marató</title>
<style>
:root{
  --bg:#fff3d9; --surface:#ffffff; --ink:#1e2a44; --muted:#5f6b85; --line:#ecd7a6;
  --accent:#5e7ab3; --fill:#4c679f; --amber:#e2b052; --lblue:#8698c7; --accent-ink:#3f5a92; --on-accent:#ffffff; --tint:#fde7b8; --amber-deep:#c98f1e; --red:#c94a35;
  --mapbg:#eadfc6; --route:#2e4a86; --shadow:0 -8px 28px rgba(30,42,68,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171a26; --surface:#1f2433; --ink:#eaf0fb; --muted:#a8b5d1; --line:#3d3a2e;
    --accent-ink:#9db2e3; --tint:#3b3220; --mapbg:#0c1220; --shadow:0 -8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#171a26; --surface:#1f2433; --ink:#eaf0fb; --muted:#a8b5d1; --line:#3d3a2e;
  --accent-ink:#9db2e3; --tint:#3b3220; --mapbg:#0c1220; --shadow:0 -8px 28px rgba(0,0,0,.5);
}
html{height:100%;background:linear-gradient(to bottom,#e2b052 0,#e2b052 env(safe-area-inset-top,0px),var(--bg) env(safe-area-inset-top,0px));scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px;margin-bottom:8px;background:#e2b052;color:#1e2a44}
.brand{min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center;gap:8px 16px}
.lockup{display:inline-flex;align-items:flex-start;padding-top:3px}
.lockup .amb{background:var(--lblue);color:#fff;font-weight:800;font-size:12px;line-height:1;padding:5px 9px 6px;border-radius:9px 9px 0 9px;margin-right:-2px;position:relative;top:-3px}
.lockup .mar{background:#5e7ab3;color:#fff;font-weight:800;font-size:17px;line-height:1;padding:7px 14px 8px;border-radius:11px}
.tv3{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 2.5px #fff;display:block;margin-left:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{margin:0;font-size:clamp(16px,1.55vw,30px);font-weight:800;letter-spacing:-.015em;line-height:1.15;color:#1e2a44}
.btn-qr{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:20px;
  border:1.5px solid #fff;background:#fff;color:#1e2a44;cursor:pointer;font-weight:600}
.btn-qr svg{width:18px;height:18px}
@media (max-width:520px){.btn-qr{padding:0;width:44px;min-height:44px;justify-content:center}.btn-qr .lbl{display:none}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 14px 8px;padding:3px;
  background:var(--tint);border-radius:14px}
.tab{min-height:38px;border:0;border-radius:10px;background:transparent;cursor:pointer;
  font-weight:600;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--fill);color:var(--on-accent)}

.mapwrap{position:relative;overflow:hidden;background:var(--mapbg);touch-action:none;
  user-select:none;-webkit-user-select:none;cursor:grab}
.mapwrap:active{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;will-change:transform;
  background:#fff;box-shadow:0 2px 20px rgba(30,42,68,.18)}
#stage img{display:block;width:1280px;height:720px;-webkit-user-drag:none;pointer-events:none}
#ov{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}

.zone{fill:rgba(94,122,179,.07);stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;
  vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:all;transition:fill .15s,opacity .2s}
.zone.cat{stroke:#fff;fill:rgba(255,255,255,.08)}
@media (hover:hover){.zone:hover{fill:rgba(94,122,179,.3)}}
.zone:focus-visible{outline:none;stroke:#ffb300;stroke-width:4;stroke-dasharray:none}
.zone.sel{fill:rgba(226,176,82,.5);stroke:#c98f1e;stroke-dasharray:none;stroke-width:3.5}
.zone.cat.sel{stroke:#c98f1e}
#ov.has-sel .zone:not(.sel){opacity:.3}

.route-halo{stroke:#fff;stroke-width:9;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.92;fill:none}
.route{stroke:var(--route);stroke-width:4;stroke-dasharray:10 9;stroke-linecap:round;
  vector-effect:non-scaling-stroke;fill:none;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-19}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.8);opacity:0}}
.fx *,#dbg *{pointer-events:none}
.lift-label{font:700 11px 'Bricolage Grotesque',system-ui,sans-serif}

.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  cursor:pointer;font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(30,42,68,.15)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:18px;font-size:13px;font-weight:600;
  pointer-events:none;text-align:center;transition:opacity .3s}
.hint.off{opacity:0}

.panel{background:var(--surface);border-top:4px solid var(--amber);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;max-height:50vh;max-height:50dvh;min-height:0;position:relative;z-index:2;overflow:hidden}
.search{flex:none;display:flex;gap:8px;padding:8px 12px}
.toggle{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;color:var(--ink)}
.toggle svg{width:16px;height:16px;transition:transform .2s}
.toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.panel.collapsed .chips,.panel.collapsed #list{display:none}
.search input{flex:1;min-width:0;box-sizing:border-box;min-height:40px;padding:0 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.search input::placeholder{color:var(--muted)}
.listwrap{display:flex;flex-direction:column;min-height:0;flex:1}
#fichaPanel{display:flex;flex-direction:column;min-height:0}
.panel.has-sel .listwrap{display:none}
.scroll{flex:1;min-height:0;overflow:auto;padding:0 8px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.listhead{margin:4px 8px 4px;font-size:13px;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;border:0;
  background:transparent;border-radius:12px;text-align:left;cursor:pointer}
.item:hover{background:var(--tint)}
.dot{flex:none;width:12px;height:12px;border-radius:4px;background:var(--accent)}
.dot.cat{background:var(--ink)}
.item .t{flex:1;min-width:0;font-weight:600}
.item .s{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.chip{flex:none;font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--tint);color:var(--accent-ink)}
.empty{padding:16px 10px;color:var(--muted)}

.ficha{padding:0 14px 10px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px 0 4px;margin-left:-4px;
  border:0;background:transparent;cursor:pointer;color:var(--accent-ink);font-weight:600}
.back svg{width:18px;height:18px}
.ficha h2{margin:0 0 2px;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ficha .sub{margin:0 0 8px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ficha p.desc{margin:8px 0}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{min-height:40px;padding:0 16px;border-radius:22px;border:1.5px solid var(--accent);background:transparent;
  color:var(--accent-ink);font-weight:600;cursor:pointer}
.pill.primary{background:var(--amber);border-color:var(--amber);color:#1e2a44}
.note{display:none;margin:10px 0 0;font-size:13px;color:var(--muted)}

.qrcard{display:none}
.chips{flex:none;display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid var(--line);
  background:transparent;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1e2a44}
.groups{display:flex;flex-direction:column}
.col{display:contents}
.group[data-f="m"]{order:1}.group[data-f="3"]{order:2}.group[data-f="4"]{order:3}.group[data-f="5"]{order:4}
.group h3{margin:12px 10px 4px;padding-bottom:3px;border-bottom:2px solid var(--amber);font-size:14px;font-weight:800;color:var(--accent-ink);letter-spacing:-.01em}
.item.on{background:var(--tint)}
.item.on .t{font-weight:800}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(10,16,30,.6);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.dlg{background:var(--surface);border-radius:20px;padding:20px;max-width:360px;width:100%;box-sizing:border-box}
.dlg h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.dlg p{margin:0 0 12px;color:var(--muted);font-size:14px}
#qr{background:#fff;border-radius:12px;padding:8px;display:grid;place-items:center}
#qr svg{width:100%;height:auto;max-width:280px;display:block}
.dlg input{width:100%;box-sizing:border-box;min-height:44px;margin-top:12px;padding:0 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.dlg .pill{margin-top:12px;width:100%}

@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto auto minmax(0,1fr)}
  header{grid-column:1;grid-row:1;padding:10px 20px;margin-bottom:10px}
  .tabs{grid-column:1;grid-row:2;margin:0 20px 10px;max-width:none}
  .mapwrap{grid-column:1;grid-row:3}
  .panel{grid-column:2;grid-row:1/4;max-height:none;border-radius:0;border-top:0;border-left:4px solid var(--amber);box-shadow:none}
  .toggle{display:none}
  .panel.collapsed .chips,.panel.collapsed #list{display:flex}
  .panel.collapsed #list{display:block}
  .search{padding:10px 10px 6px}
  .search input{min-height:36px;font-size:15px}
  .chips{padding:0 10px 6px}
  .chipbtn{min-height:30px;font-size:13px;padding:0 11px}
  .scroll{padding:0 6px 8px}
  .groups{display:grid;grid-template-columns:1fr 1fr;column-gap:6px;align-items:start}
  .col{display:block}
  .group h3{margin:2px 8px 2px;font-size:13px}
  .col .group + .group h3{margin-top:10px}
  .item{min-height:clamp(26px,3.8vh,38px);padding:1px 8px;gap:8px;font-size:14px;line-height:1.2}
  .dot{width:10px;height:10px}
  .item .s{font-size:11.5px;line-height:1.2}
  #fichaPanel{order:2;flex:none}
  .qrcard{display:flex;flex:none;order:3;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
  .qrcard p{margin:0;font-weight:700;font-size:14px;line-height:1.25;color:var(--ink)}
  #qrBox{flex:none;width:104px;height:104px;box-sizing:border-box;padding:4px;background:#fff;border-radius:8px}
  #qrBox svg{display:block;width:100%;height:100%}
  .ficha{position:relative;padding:10px 12px 12px;background:var(--tint);border-top:3px solid var(--amber)}
  .ficha .back{position:absolute;right:8px;top:6px;margin:0;min-height:32px}
  .ficha h2{font-size:19px;padding-right:84px}
  .pill{min-height:34px;font-size:14px;padding:0 14px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .route,.pulse{animation:none}
}
</style>
</head>

const boxOf=()=>FB[cur].box;
function measure(){const r=view.getBoundingClientRect();vw=r.width;vh=r.height;const b=boxOf();fit=Math.min(vw/(b[2]-b[0]),vh/(b[3]-b[1]))||1;}
function clampView(){
  const b=boxOf(),w=(b[2]-b[0])*K,h=(b[3]-b[1])*K;
  X=w<=vw?(vw-w)/2-b[0]*K:Math.min(-b[0]*K,Math.max(vw-b[2]*K,X));
  Y=h<=vh?(vh-h)/2-b[1]*K:Math.min(-b[1]*K,Math.max(vh-b[3]*K,Y));
}
function apply(){
  clampView();
  stage.style.transform=`translate(${X}px,${Y}px) scale(${K})`;
  ov.style.setProperty('--inv',1/K);
}
function anim(on){
  if(on&&!reduce){stage.style.transition='transform .5s cubic-bezier(.2,.7,.2,1)';clearTimeout(anim.t);anim.t=setTimeout(()=>stage.style.transition='none',560);}
  else stage.style.transition='none';
}
function zoomAt(px,py,nk){
  nk=Math.min(fit*7,Math.max(fit,nk));
  const f=nk/K;X=px-(px-X)*f;Y=py-(py-Y)*f;K=nk;apply();
}

function focusBox(b,pad){

  let nk=Math.min(vw/bw,vh/bh);nk=Math.min(fit*5,Math.max(fit,nk));
  anim(true);K=nk;X=vw/2-((b.x1+b.x2)/2)*K;Y=vh/2-((b.y1+b.y2)/2)*K;apply();
}

const ptrs=new Map();let moved=false,start=null,pinch=null;
const pinchData=()=>{const [a,b]=[...ptrs.values()];return{cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)||1};};
view.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ctl'))return;
  if(ptrs.size===0)moved=false;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  anim(false);
  if(ptrs.size===1)start={x:e.clientX,y:e.clientY,X,Y};
  if(ptrs.size===2)pinch=pinchData();
});
window.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    const dx=e.clientX-start.x,dy=e.clientY-start.y;
    if(Math.hypot(dx,dy)>6)moved=true;
    if(moved){X=start.X+dx;Y=start.Y+dy;apply();}
  }else if(ptrs.size===2){
    moved=true;
    const p=pinchData(),r=view.getBoundingClientRect();
    X+=p.cx-pinch.cx;Y+=p.cy-pinch.cy;
    zoomAt(p.cx-r.left,p.cy-r.top,K*p.d/pinch.d);
    pinch=p;
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  const was=ptrs.size;ptrs.delete(e.pointerId);
  if(was===1&&!moved&&e.type==='pointerup')tap(e);
  if(ptrs.size===1){const [p]=ptrs.values();start={x:p.x,y:p.y,X,Y};}
  if(ptrs.size<2)pinch=null;
}
window.addEventListener('pointerup',endPtr);

function drawZones(){

function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function clearFx(){fxG.innerHTML='';}
function drawFx(){
  clearFx();

function itemHtml(z,showFloor){
  return `<button class="item${z.id===sel?' on':''}" type="button" data-id="${z.id}"><span class="dot${z.kind==='cat'?' cat':''}"></span>
    <span class="t">${esc(z.name)}${z.sub?`<span class="s">${esc(z.sub)}</span>`:''}</span>
    ${showFloor?`<span class="chip">${esc(FB[z.f].short)}</span>`:''}</button>`;
}
function renderList(){
  const n=norm(query.trim());
  let html='';
  if(n){
    const items=LIST.filter(z=>norm(z.name+' '+(z.sub||'')).includes(n));
    html=`<p class="listhead">${items.length+(items.length===1?' resultado':' resultados')}</p>`;
    if(!items.length)html+='<p class="empty">No hay actividades con ese nombre. Prueba con otra palabra.</p>';
    html+=items.map(z=>itemHtml(z,true)).join('');
  }else if(flt==='all'){
    const grp=f=>`<div class="group" data-f="${f.id}"><h3>${esc(f.name)}</h3>${LIST.filter(z=>z.f===f.id).map(z=>itemHtml(z,false)).join('')}</div>`;
    html=`<div class="groups"><div class="col">${grp(FB['3'])}</div><div class="col">${[FB.m,FB['4'],FB['5']].map(grp).join('')}</div></div>`;
  }else{
    html=`<p class="listhead">Actividades en ${esc(FB[flt].name)}</p>`+LIST.filter(z=>z.f===flt).map(z=>itemHtml(z,false)).join('');
  }
  listEl.innerHTML=html;
  listEl.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));
  if(sel&&isDesk()){const o=listEl.querySelector('.item.on');if(o)o.scrollIntoView({block:'nearest'});}
}

/* ---- arranque ---- */
setFloor('m');renderPanel();
</script>
